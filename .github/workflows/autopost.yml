name: autopost

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05 UTC; posts only when a video in queue.json is due
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test the token | dry-run = show next post | run = post if due | now = post one item now"
        default: check
        type: choice
        options: [check, dry-run, run, now]
      item:
        description: "Queue id for mode 'now' (example: HalfTheMoon_Part1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python post.py ${{ github.event.inputs.mode || 'run' }} ${{ github.event.inputs.item }}
      - name: Save what was posted
        if: always()
        run: |
          if ! git diff --quiet posted.json; then
            git config user.name "autopost-bot"
            git config user.email "autopost-bot@users.noreply.github.com"
            git add posted.json
            git commit -m "posted: update log"
            git push
          fi
