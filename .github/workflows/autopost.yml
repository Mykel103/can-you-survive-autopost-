name: autopost

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05 UTC; posts only when a video in queue.json is due
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test Meta | dry-run = show next post | run = post if due | now = post one item now | tiktok-link, tiktok-code, tiktok-check = TikTok setup"
        default: check
        type: choice
        options: [check, dry-run, run, now, tiktok-link, tiktok-code, tiktok-check]
      item:
        description: "Queue id for mode 'now' (example: HalfTheMoon_Part1), or the page address TikTok sent you to, for tiktok-code"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Post
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_VAULT_KEY: ${{ secrets.TIKTOK_VAULT_KEY }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
          ITEM: ${{ github.event.inputs.item }}
        run: python post.py "$MODE" "$ITEM"
      - name: Save what was posted
        if: always()
        run: |
          git add posted.json
          [ -f tiktok_token.enc ] && git add tiktok_token.enc
          if ! git diff --cached --quiet; then
            git config user.name "autopost-bot"
            git config user.email "autopost-bot@users.noreply.github.com"
            git commit -m "posted: update log"
            git push
          fi
